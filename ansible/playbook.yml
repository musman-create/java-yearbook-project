---
- name: Configure AWS EC2 Server and Deploy Applications
  hosts: all
  become: true
  vars:
    project_dir: "/home/ubuntu/app"

  tasks:
    - name: Hard purge any broken repository files containing docker from the cloud server
      shell: |
        rm -f /etc/apt/sources.list.d/*docker*.list
        rm -f /etc/apt/sources.list.d/*archive_uri*.list
      ignore_errors: yes

    - name: Update apt repo cache cleanly
      apt:
        update_cache: yes
        force_apt_get: yes

    - name: Install underlying system dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
          - lsb-release
        state: present

    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download official Docker GPG signing key cleanly
      get_url:
        url: https://docker.com
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Direct inject official Docker stable tracking repository
      shell: |
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://docker.com $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list

    - name: Install core runtime Docker ecosystem engines
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Verify execution group contexts contain Target user
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Construct isolated source directory structure
      file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      tags: deploy

    - name: Copy whole application workspace contents onto target server
      copy:
        src: ../
        dest: "{{ project_dir }}/"
        owner: ubuntu
        group: ubuntu
      tags: deploy

    - name: Launch active apps via Docker Compose on the cloud server
      shell: |
        docker compose down
        docker compose up -d --build
      args:
        chdir: "{{ project_dir }}"
      tags: deploy
