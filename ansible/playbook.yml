---
- name: Configure EC2 and deploy the applications
  hosts: webserver
  become: true
  gather_facts: true

  vars:
    project_dir: /home/ubuntu/app

  tasks:
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create Docker keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download official Docker signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Get Debian package architecture
      ansible.builtin.command: dpkg --print-architecture
      register: docker_arch
      changed_when: false

    - name: Configure official Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy Docker Compose configuration
      ansible.builtin.copy:
        src: ../docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy Java application source
      ansible.builtin.copy:
        src: ../java/
        dest: "{{ project_dir }}/java/"
        owner: ubuntu
        group: ubuntu

    - name: Copy portfolio website
      ansible.builtin.copy:
        src: ../myportfolio/
        dest: "{{ project_dir }}/myportfolio/"
        owner: ubuntu
        group: ubuntu

    - name: Build and start application containers
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
          - --build
      args:
        chdir: "{{ project_dir }}"
