name: Modern End-to-End DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Compile and package the Java application using Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Application
        run: |
          cd java
          mvn clean package -DskipTests

      # Step 3: Configure AWS Credentials for Terraform
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      # Step 4: Initialize and apply the Terraform configuration
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false # <-- THIS STOPS GITHUB FROM ADDING DEBUGLOG TEXT

      # Give this step an explicit ID so we can pull its clean outputs later
      - name: Terraform Init and Apply
        id: tf_apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      # Step 5: Capture EC2 Public IP and Dynamically Write Ansible's Inventory
      - name: Generate Dynamic Inventory and Execute Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # 1. Fetch clean output strictly from Terraform directly
          cd terraform
          EC2_IP=$(terraform output -raw ec2_public_ip | tr -d '\r\n[:space:]')
          cd ..
          
          echo "Cleaned Target Host IP: '$EC2_IP'"

          # 2. Re-create the secure private key file in the absolute workspace root
          echo "${{ secrets.AWS_SSH_KEY }}" > $GITHUB_WORKSPACE/sanni.pem
          chmod 400 $GITHUB_WORKSPACE/sanni.pem

          # 3. Dynamically write out target configuration
          echo "[webservers]" > ansible/inventory.ini
          echo "$EC2_IP ansible_user=ubuntu ansible_ssh_private_key_file=$GITHUB_WORKSPACE/sanni.pem" >> ansible/inventory.ini

          # 4. Execute your actual playbook using the dynamic inventory file
          cd ansible
          ansible-playbook -i inventory.ini playbook.yml

