name: Modern End-to-End DevOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: capstone-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS credentials for Terraform and the S3 backend
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Terraform checks the existing infrastructure without applying changes
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Plan infrastructure changes
        working-directory: terraform
        run: terraform plan -input=false -no-color

      # Build the Java application
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Build Java application
        run: mvn -f java/pom.xml clean package -DskipTests

      # Install Ansible for deployment
      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      # Create the SSH key and inventory from GitHub secrets
      - name: Prepare SSH key and Ansible inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
        run: |
          set -eu

          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST secret is missing."
            exit 1
          fi

          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "AWS_SSH_PRIVATE_KEY secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/sanni.pem"
          chmod 600 "$HOME/.ssh/sanni.pem"

          {
            echo "[webserver]"
            printf "%s ansible_user=ubuntu ansible_ssh_private_key_file=%s ansible_python_interpreter=/usr/bin/python3\n" \
              "$EC2_HOST" "$HOME/.ssh/sanni.pem"
          } > ansible/inventory.ini

          chmod 600 ansible/inventory.ini

      - name: Check Ansible playbook syntax
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml \
            --syntax-check

      # Deploy the portfolio and Java application to the existing EC2 server
      - name: Deploy applications to EC2
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook.yml

      - name: Verify running containers
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible webserver \
            -i ansible/inventory.ini \
            -b \
            -m command \
            -a "docker ps"
